<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Control — Magnolia Horses</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#f5f1eb; --surface:#fff; --surface2:#f1f0ec; --border:rgba(0,0,0,.1); --border2:rgba(0,0,0,.18);
  --text:#2a1f14; --text2:#6b5a48; --text3:#9c8a78; --brand:#8b3a3a; --red:#a32d2d; --red-bg:#fcebeb;
  --amber:#8a5a00; --amber-bg:#fdf3dc; --blue:#1f4e79; --blue-bg:#e6eff8; --radius:8px; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b1713; --surface:#26211b; --surface2:#2f2922; --border:rgba(255,255,255,.1);
  --border2:rgba(255,255,255,.2); --text:#f0e9df; --text2:#bfb2a2; --text3:#8f8374; --brand:#e0908a; --red:#ff9a9a; --red-bg:#4a2323;
  --amber:#f0c36a; --amber-bg:#46361a; --blue:#8ec1f0; --blue-bg:#1f3347; } }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); font-size:15px; line-height:1.5; }
.page { max-width:900px; margin:0 auto; padding:1rem 16px 3rem; }
header { display:flex; align-items:baseline; gap:12px; padding:.75rem 0; border-bottom:.5px solid var(--border2); margin-bottom:1rem; flex-wrap:wrap; }
h1 { font-size:20px; font-family:Georgia,serif; color:var(--brand); }
header a { margin-left:auto; font-size:13px; color:var(--brand); text-decoration:none; }
.tabs { display:flex; gap:6px; margin-bottom:1rem; }
.tab { padding:6px 14px; border-radius:var(--radius); font-size:14px; background:var(--surface2); color:var(--text2); }
.tab.on { background:var(--brand); color:#fff; }
.filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:.75rem; }
.filters .wide { grid-column:1 / -1; }
.filters input, .filters select { width:100%; padding:9px 10px; font-size:16px; font-family:inherit; background:var(--surface); color:var(--text);
  border:.5px solid var(--border2); border-radius:var(--radius); }
.meta { font-size:13px; color:var(--text2); margin-bottom:.75rem; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.meta button { font-size:13px; padding:3px 10px; background:var(--surface2); color:var(--text); border:.5px solid var(--border2); border-radius:var(--radius); cursor:pointer; }
.day { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text3); margin:1.1rem 0 .4rem; }
.msg { background:var(--surface); border:.5px solid var(--border); border-radius:var(--radius); padding:9px 12px; margin-bottom:6px; }
.msg.out { border-left:3px solid var(--blue); }
.msg.warn { border-left:3px solid var(--amber); }
.msg.error { border-left:3px solid var(--red); }
.top { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--text2); margin-bottom:3px; flex-wrap:wrap; }
.chip { padding:1px 8px; border-radius:99px; background:var(--surface2); font-size:11px; font-weight:600; text-transform:uppercase; }
.chip.out { background:var(--blue-bg); color:var(--blue); }
.chip.file { background:var(--amber-bg); color:var(--amber); }
.body { white-space:pre-wrap; word-break:break-word; font-size:14px; }
.body.clamped { max-height:7.5em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 70%,transparent); mask-image:linear-gradient(#000 70%,transparent); }
.more { font-size:12px; color:var(--brand); cursor:pointer; margin-top:2px; background:none; border:none; padding:0; }
mark { background:var(--amber-bg); color:var(--text); border-radius:2px; padding:0 1px; }
.empty { text-align:center; color:var(--text3); padding:2rem 0; }
.loadmore { display:block; margin:1rem auto; padding:9px 22px; font-size:14px; background:var(--brand); color:#fff; border:none; border-radius:var(--radius); cursor:pointer; }
</style>
</head>
<body>
<div class="page">
  <header><h1>Control</h1><span style="font-size:13px;color:var(--text2)">Message history</span><a href="/">Back to site</a></header>
  <div class="tabs"><span class="tab on">Messages</span></div>

  <div class="filters">
    <input class="wide" id="q" type="search" placeholder="Search messages (all words must match)" autocomplete="off"/>
    <select id="source"><option value="">All sources</option></select>
    <select id="direction"><option value="">Both directions</option><option value="in">From the system</option><option value="out">My commands</option></select>
    <input id="from" type="date" aria-label="From date"/>
    <input id="to" type="date" aria-label="To date"/>
  </div>

  <div class="meta"><span id="count"></span><button id="reset" type="button">Clear filters</button></div>
  <div id="list"></div>
  <button id="more" class="loadmore" style="display:none" type="button">Load older</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let offset = 0, timer = null, loading = false, lastDay = null;

function highlight(text, q) {
  let out = esc(text);
  q.split(/\s+/).filter(Boolean).forEach(w => {
    const re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}

function params() {
  const p = new URLSearchParams();
  [['q','q'],['source','source'],['direction','direction'],['from','from'],['to','to']].forEach(([id,k]) => { const v = $(id).value.trim(); if (v) p.set(k, v); });
  p.set('offset', offset);
  return p;
}

function render(m, q) {
  const day = (m.msg_time || '').slice(0, 10);
  let html = '';
  if (day !== lastDay) { lastDay = day; html += '<div class="day">' + esc(day) + '</div>'; }
  const long = (m.text || '').length > 400;
  html += '<div class="msg ' + (m.direction === 'out' ? 'out ' : '') + esc(m.level || '') + '">' +
    '<div class="top"><span>' + esc((m.msg_time || '').slice(11, 19)) + '</span><span class="chip">' + esc(m.source || 'other') + '</span>' +
    (m.direction === 'out' ? '<span class="chip out">my command</span>' : '') +
    (m.has_file ? '<span class="chip file">file' + (m.file_name ? ': ' + esc(m.file_name) : '') + '</span>' : '') + '</div>' +
    '<div class="body' + (long ? ' clamped' : '') + '">' + highlight(m.text || '', q) + '</div>' +
    (long ? '<button class="more" type="button">Show all</button>' : '') + '</div>';
  return html;
}

async function load(reset) {
  if (loading) return; loading = true;
  if (reset) { offset = 0; lastDay = null; $('list').innerHTML = ''; }
  try {
    const r = await fetch('/control/api/messages?' + params());
    if (r.status === 401 || r.redirected) { location.href = '/login?next=/control'; return; }
    const d = await r.json();
    const q = $('q').value.trim();
    if (reset) {
      const cur = $('source').value;
      $('source').innerHTML = '<option value="">All sources</option>' + d.sources.map(s => '<option value="' + esc(s) + '"' + (s === cur ? ' selected' : '') + '>' + esc(s) + '</option>').join('');
      $('count').textContent = d.total.toLocaleString() + ' message' + (d.total === 1 ? '' : 's');
    }
    $('list').insertAdjacentHTML('beforeend', d.messages.map(m => render(m, q)).join(''));
    if (reset && !d.messages.length) $('list').innerHTML = '<div class="empty">Nothing found.</div>';
    offset += d.messages.length;
    $('more').style.display = d.has_more ? 'block' : 'none';
  } finally { loading = false; }
}

$('list').addEventListener('click', e => {
  if (!e.target.classList.contains('more')) return;
  const body = e.target.previousElementSibling; body.classList.toggle('clamped');
  e.target.textContent = body.classList.contains('clamped') ? 'Show all' : 'Show less';
});
['source','direction','from','to'].forEach(id => $(id).addEventListener('change', () => load(true)));
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => load(true), 300); });
$('more').addEventListener('click', () => load(false));
$('reset').addEventListener('click', () => { ['q','source','direction','from','to'].forEach(id => $(id).value = ''); load(true); });
load(true);
</script>
</body>
</html>
