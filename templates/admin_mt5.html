<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MT5 trades — Magnolia Horses</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f1eb; --surface: #fff; --surface2: #f1f0ec;
      --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
      --text: #2a1f14; --text2: #6b5a48; --text3: #9c8a78;
      --brand: #8b3a3a; --brand-light: #f5ece8;
      --green: #3b6d11; --green-bg: #eaf3de;
      --red: #a32d2d; --red-bg: #fcebeb;
      --radius: 8px; --radius-lg: 12px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
    .page { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    .brand-header { display: flex; align-items: center; gap: 14px; padding: 1.25rem 0 1rem; margin-bottom: 0.25rem; border-bottom: 0.5px solid rgba(139,58,58,0.2); }
    .brand-name { font-size: 22px; font-weight: 600; color: var(--brand); font-family: Georgia, serif; }
    .brand-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .back-link { font-size: 13px; color: var(--brand); text-decoration: none; margin-left: auto; }
    .back-link:hover { text-decoration: underline; }

    .panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }
    .panel-title { font-size: 16px; font-weight: 500; margin-bottom: 1rem; color: var(--brand); }

    .filter-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-row input, .filter-row select {
      padding: 7px 10px; font-size: 14px; font-family: inherit; background: var(--surface2);
      color: var(--text); border: 0.5px solid var(--border2); border-radius: var(--radius); outline: none;
    }
    .filter-row input:focus, .filter-row select:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(139,58,58,0.1); }
    .filter-row input[type="text"] { width: 120px; }

    .btn { padding: 7px 16px; font-size: 14px; font-family: inherit; border-radius: var(--radius); cursor: pointer; border: none; background: var(--brand); color: #fff; }
    .btn:hover { opacity: 0.88; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 6px 10px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 0.5px solid var(--border); }
    td { padding: 8px 10px; border-bottom: 0.5px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr.event-row { cursor: pointer; }
    tr.event-row:hover td { background: var(--brand-light); }

    .pill { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text2); }
    .pill-signal { background: var(--surface2); color: var(--text2); }
    .pill-ticket { background: var(--green-bg); color: var(--green); }
    .pill-instruction { background: var(--red-bg); color: var(--red); }

    .data-row td { padding: 0 10px 10px; background: var(--surface2); display: none; }
    .data-row.show td { display: table-cell; }
    .data-row pre { font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--text2); font-family: 'SF Mono', Consolas, monospace; }

    .empty { text-align: center; padding: 2rem; color: var(--text3); font-size: 14px; }
    .count { font-size: 12px; color: var(--text3); margin-bottom: 0.75rem; }
  </style>
</head>
<body>
<div class="page">

  <div class="brand-header">
    <div>
      <div class="brand-name">Magnolia Horses</div>
      <div class="brand-sub">MT5 trading system — signals, tickets &amp; instructions</div>
    </div>
    <a href="/" class="back-link">← Back to search</a>
  </div>

  <div class="panel">
    <div class="panel-title">Filters</div>
    <div class="filter-row">
      <select id="f-source">
        <option value="all">All sources</option>
        <option value="t1">Trader 1</option>
        <option value="t2">Trader 2</option>
        <option value="t3">Trader 3</option>
        <option value="lewis">Lewis</option>
      </select>
      <input type="text" id="f-symbol" placeholder="Symbol (e.g. XAUUSD)" />
      <input type="date" id="f-date" />
      <button class="btn" onclick="loadEvents()">Filter</button>
    </div>
    <div class="count" id="count"></div>
    <div id="events"></div>
  </div>

</div>

<script>
  const QUERY_KEY = {{ query_key|tojson }};

  function escHtml(str) { return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function pillClass(kind) {
    if (kind === 'ticket') return 'pill pill-ticket';
    if (kind === 'instruction') return 'pill pill-instruction';
    return 'pill pill-signal';
  }

  async function loadEvents() {
    const source = document.getElementById('f-source').value;
    const symbol = document.getElementById('f-symbol').value.trim();
    const dateVal = document.getElementById('f-date').value;

    const params = new URLSearchParams({ key: QUERY_KEY });
    if (source !== 'all') params.set('source', source);
    if (symbol) params.set('symbol', symbol);
    if (dateVal) params.set('date', dateVal);

    const res = await fetch(`/mt5/api/trades?${params.toString()}`);
    if (!res.ok) {
      document.getElementById('events').innerHTML = `<div class="empty">Could not load events (${res.status})</div>`;
      return;
    }
    const data = await res.json();
    renderEvents(data);
  }

  function renderEvents(data) {
    const countEl = document.getElementById('count');
    const el = document.getElementById('events');
    countEl.textContent = `${data.length} event${data.length === 1 ? '' : 's'}`;
    if (data.length === 0) {
      el.innerHTML = `<div class="empty">No events match these filters</div>`;
      return;
    }
    let html = `<table><thead><tr>
      <th>Time</th><th>Source</th><th>Kind</th><th>Symbol</th><th>Key fields</th>
    </tr></thead><tbody>`;
    data.forEach((e, i) => {
      const d = e.data || {};
      const summary = Object.entries(d).slice(0, 4)
        .map(([k, v]) => `${k}=${v}`).join('  ');
      html += `<tr class="event-row" onclick="toggleRow(${i})">
        <td>${escHtml(e.event_time)}</td>
        <td><span class="pill">${escHtml(e.source)}</span></td>
        <td><span class="${pillClass(e.kind)}">${escHtml(e.kind)}</span></td>
        <td>${escHtml(e.symbol)}</td>
        <td style="color:var(--text2)">${escHtml(summary)}</td>
      </tr>
      <tr class="data-row" id="data-${i}">
        <td colspan="5"><pre>${escHtml(JSON.stringify(d, null, 2))}</pre></td>
      </tr>`;
    });
    html += `</tbody></table>`;
    el.innerHTML = html;
  }

  function toggleRow(i) {
    document.getElementById(`data-${i}`).classList.toggle('show');
  }

  document.getElementById('f-date').valueAsDate = new Date();
  loadEvents();
</script>
</body>
</html>
